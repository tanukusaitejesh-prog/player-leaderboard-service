spring:
  application:
    name: player-leaderboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaderboard}
    username: ${DB_USERNAME:leaderboard}
    password: ${DB_PASSWORD:leaderboard}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

spring:
  application:
    name: player-leaderboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaderboard}
    username: ${DB_USERNAME:leaderboard}
    password: ${DB_PASSWORD:leaderboard}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        # Fail fast when the broker is down: the outbox retries, and the poller holds row locks.
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
    consumer:
      group-id: leaderboard-updater
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": dev.tejesh.leaderboard.score
        "[spring.json.value.default.type]": dev.tejesh.leaderboard.score.ScoreSubmittedEvent
        "[spring.json.use.type.headers]": false
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

outbox:
  poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:200}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  ack-timeout-ms: 15000
